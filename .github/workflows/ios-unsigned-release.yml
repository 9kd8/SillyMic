name: ios-unsigned-ipa-release

on:
  workflow_dispatch:

concurrency:
  group: ios-unsigned-ipa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa-release:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_SCHEME: SillyMicNative
      IOS_WORKSPACE: ios/SillyMicNative.xcworkspace
      ARCHIVE_PATH: build/SillyMicMobile.xcarchive
      BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/Gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install CocoaPods (Bundler)
        run: |
          cd ios
          bundle exec pod install

      - name: Build unsigned archive (release)
        run: |
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Pack unsigned IPA
        run: |
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive products"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -r SillyMicMobile-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillymic-mobile-unsigned-ipa-release
          path: mobile/build/SillyMicMobile-unsigned.ipa
